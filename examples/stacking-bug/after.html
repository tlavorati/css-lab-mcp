<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stacking bug - after</title>
  <style>
    /* Shared feed styles. The bug: every direct child of a card gets its own stacking layer. */
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: #f1f5f9; color: #0f172a; }
    .feed { max-width: 560px; margin: 24px auto; padding: 0 16px; display: block; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 12px; }

    .card > * {
      position: relative;
      z-index: 1;
    }

    .card-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; }
    .card-header h2 { margin: 0; font-size: 16px; }
    .card-body { padding: 0 14px 12px; color: #475569; }
    .menu-toggle { border: 0; background: #e2e8f0; border-radius: 6px; padding: 4px 10px; cursor: pointer; }

    .menu { position: absolute; right: 14px; top: 40px; z-index: 1000; display: none;
      background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 4px; min-width: 160px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, .15); }
    .menu.open { display: block; }
    .menu-item { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; cursor: pointer; font: inherit; }
    .menu-item:hover { background: #f1f5f9; }
    .menu-item.danger { color: #b91c1c; }

    /* FIX: lift only the card child that contains the open menu above its sibling layers. */
    .card > .card-header:has(.menu.open) {
      z-index: 2;
    }
  </style>
</head>
<body>
  <main class="feed">
    <article class="card">
      <header class="card-header">
        <h2>First post</h2>
        <button class="menu-toggle" aria-label="More actions">&middot;&middot;&middot;</button>
        <div class="menu" role="menu">
          <button class="menu-item" role="menuitem">Edit</button>
          <button class="menu-item" role="menuitem">Duplicate</button>
          <button class="menu-item danger" role="menuitem">Delete</button>
        </div>
      </header>
      <p class="card-body">Open the menu with the &middot;&middot;&middot; button, then try "Delete".</p>
    </article>
    <article class="card">
      <header class="card-header">
        <h2>Second post</h2>
        <button class="menu-toggle" aria-label="More actions">&middot;&middot;&middot;</button>
        <div class="menu" role="menu">
          <button class="menu-item" role="menuitem">Edit</button>
          <button class="menu-item" role="menuitem">Duplicate</button>
          <button class="menu-item danger" role="menuitem">Delete</button>
        </div>
      </header>
      <p class="card-body">Another short body.</p>
    </article>
    <article class="card">
      <header class="card-header">
        <h2>Third post</h2>
        <button class="menu-toggle" aria-label="More actions">&middot;&middot;&middot;</button>
        <div class="menu" role="menu">
          <button class="menu-item" role="menuitem">Edit</button>
          <button class="menu-item" role="menuitem">Duplicate</button>
          <button class="menu-item danger" role="menuitem">Delete</button>
        </div>
      </header>
      <p class="card-body">And one more.</p>
    </article>
  </main>
  <p id="log" style="text-align:center"></p>
  <script>
    document.addEventListener('click', function (e) {
      var toggle = e.target.closest('.menu-toggle');
      document.querySelectorAll('.menu.open').forEach(function (m) {
        if (!toggle || m !== toggle.nextElementSibling) m.classList.remove('open');
      });
      if (toggle) toggle.nextElementSibling.classList.toggle('open');
      var item = e.target.closest('.menu-item');
      if (item) document.getElementById('log').textContent = 'clicked: ' + item.textContent;
    });
  </script>
</body>
</html>
